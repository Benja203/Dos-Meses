  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Lluvia de rosas */
    #rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .rose {
      position: absolute;
      top: -40px;
      font-size: 1rem;
      opacity: 0;
      animation: rosefall linear infinite;
      user-select: none;
    }

    @keyframes rosefall {
      0%   { transform: translateY(0) rotate(0deg) scale(0.8);  opacity: 0; }
      5%   { opacity: 0.85; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(110vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    /* Partícula de brillo de fondo */
    .sparkle {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(200, 50, 80, 0.4);
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(2); }
    }

    /* ── LETRA DE FONDO ── */
    #lyrics-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lyrics-bg pre {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.75rem, 1.8vw, 1.1rem);
      line-height: 1.9;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.18);
      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 100vw;
      padding: 2rem;
      user-select: none;
      animation: lyricsDrift 60s linear infinite;
    }

    @keyframes lyricsDrift {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-3%); }
      100% { transform: translateY(0); }
    }

    /* Contenido central */
    #center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
    }

    /* Línea decorativa arriba */
    .deco-line {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: rgba(180, 40, 60, 0.6);
      font-size: 0.7rem;
      letter-spacing: 4px;
    }
    .deco-line::before,
    .deco-line::after {
      content: '';
      display: block;
      width: 40px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(180,40,60,0.5));
    }
    .deco-line::after {
      background: linear-gradient(to left, transparent, rgba(180,40,60,0.5));
    }

    /* Subtítulo */
    #subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.65rem, 2.5vw, 0.85rem);
      font-weight: 600;
      color: rgba(200, 150, 150, 0.75);
      letter-spacing: 6px;
      text-transform: uppercase;
      animation: fadeUp 1.2s ease 0.3s both;
    }

    /* El número */
    #number {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(4rem, 15vw, 8rem);
      color: transparent;
      background: linear-gradient(160deg, #fff 10%, #e8a0a8 40%, #c0394b 70%, #7b0e1e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 1.3;
      letter-spacing: 1.5rem;
      text-indent: 1.5rem;
      animation: fadeUp 1s ease 0s both, glow 3s ease-in-out 1.2s infinite;
      filter: drop-shadow(0 0 40px rgba(180,40,60,0.25));
      user-select: none;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(180,40,60,0.2)); }
      50%       { filter: drop-shadow(0 0 60px rgba(200,60,80,0.45)); }
    }

    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Ornamento inferior */
    #ornament {
      font-size: 1rem;
      color: rgba(180, 40, 60, 0.5);
      letter-spacing: 10px;
      animation: fadeUp 1.2s ease 0.6s both;
    }

    /* Mensaje intermedio */
    #message {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.6rem, 2vw, 0.75rem);
      font-weight: 400;
      color: rgba(200, 150, 150, 0.65);
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeUp 1.2s ease 0.5s both;
    }

    /* Mensaje de amor */
    #love-message {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2.5vw, 1.2rem);
      font-style: italic;
      font-weight: 300;
